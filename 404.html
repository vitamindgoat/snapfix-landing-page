<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found, SnapFix</title>
<meta name="description" content="That page doesn't exist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;font-stretch:75% 100%;src:url(assets/fonts/bricolage-grotesque-latin-standard-normal.woff2) format("woff2-variations")}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-display:swap;font-weight:400 900;src:url(assets/fonts/schibsted-grotesk-latin-wght-normal.woff2) format("woff2-variations")}
:root{color-scheme:dark;--ink:#000;--text:#F3F0EA;--text-dim:#9D9890;--focus:#F2B64B;--rule:rgba(243,240,234,.14);--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;--gutter:clamp(16px,5vw,72px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px var(--gutter)}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-0.02em}
.mark i{position:relative;width:16px;height:16px;display:block}
.mark i::before,.mark i::after{content:"";position:absolute;width:6px;height:6px;border:1.75px solid currentColor}
.mark i::before{left:0;top:0;border-right:0;border-bottom:0}
.mark i::after{right:0;bottom:0;border-left:0;border-top:0}
.nav a.back{text-decoration:none;color:var(--text-dim);font-size:.95rem}
.nav a.back:hover{color:var(--text)}
main{padding:8vh var(--gutter) 14vh;max-width:40rem}
h1{font-family:var(--display);font-weight:600;letter-spacing:-0.03em;line-height:1;font-size:clamp(2.2rem,5vw,3.6rem);margin:0 0 10px;text-wrap:balance}
.meta{color:var(--text-dim);font-size:.95rem;margin:0 0 40px}
h2{font-family:var(--display);font-weight:600;letter-spacing:-0.02em;font-size:1.4rem;line-height:1.15;margin:40px 0 10px}
p{margin:0 0 1em}
ul{padding-left:1.2em;margin:0 0 1em}
li{margin-bottom:.4em}
.big{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.25;letter-spacing:-0.02em;color:var(--text);margin-bottom:1.4em}
footer{padding:24px var(--gutter) 40px;border-top:1px solid var(--rule);color:var(--text-dim);font-size:.9rem;display:flex;gap:22px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}
</style>
</head>
<body>
<nav class="nav"><a class="mark" href="./"><i></i>SnapFix</a><a class="back" href="./">Back to the site</a></nav>
<main>

<h1>Nothing here.</h1>
<p class="meta">Error 404</p>
<p class="big">That page doesn't exist, or it moved. The whole site is one page anyway.</p>
<p><a href="./">Go to the SnapFix page</a></p>

</main>
<footer><span>© 2026 Oleksandr Rybitskyi</span><a href="privacy">Privacy</a><a href="terms">Terms</a><a href="https://github.com/vitamindgoat/snapfix-landing-page">Source on GitHub</a></footer>
</body>
</html>
